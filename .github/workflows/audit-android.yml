# Audit screenshots of the Android app with sample data, on a phone and a tablet emulator, upright and sideways.
# The debug build's "demo" mode never talks to the server. Nothing is signed or sent to Google Play.
# The app's code is read with the read-only key. Only screenshots are kept, for three days.
name: Audit screenshots (Android phone and tablet)

on:
  workflow_dispatch:
    inputs:
      devices:
        description: 'phone, tablet, or both'
        default: 'both'
      only:
        description: 'Only these pages, e.g. 2:card (empty: every page)'
        default: ''

permissions:
  contents: read

jobs:
  shots:
    if: github.actor == 'gugusballpythonworld' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(inputs.devices == 'both' && '["phone","tablet"]' || format('["{0}"]', inputs.devices)) }}
    steps:
      - name: Get the screenshot script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Get the app code (read-only key, nothing printed)
        uses: actions/checkout@v4
        with:
          repository: gugusballpythonworld/gugusreptilecare
          ref: main
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          path: app
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build the debug app (error messages only if it fails)
        working-directory: app/android-native
        run: |
          set +e
          gradle --no-daemon --console=plain assembleDebug > "$RUNNER_TEMP/build.log" 2>&1
          RC=$?
          if [ $RC -ne 0 ]; then grep -E "^e: |error:|What went wrong" "$RUNNER_TEMP/build.log" | sed -E 's#file://[^ ]*/android-native/#./#' | sort -u | head -30; exit $RC; fi
          cp app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/app.apk"
      - name: Let the emulator use the processor
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.device == 'phone' && 'pixel_7' || 'pixel_tablet' }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ONLY="${{ inputs.only }}" bash "$GITHUB_WORKSPACE/.github/audit-android-shots.sh" "${{ matrix.device }}" "$RUNNER_TEMP/app.apk"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-${{ matrix.device }}
          path: shots
          retention-days: 3
